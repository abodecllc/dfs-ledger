<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DFS Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#e9ecef; --panel:#fff; --rule:#d3d9de; --rule-hard:#aab4bd;
  --ink:#0f1720; --ink-2:#4a5560; --ink-3:#7b8792;
  --accent:#b26a00; --accent-soft:#fdf3e3;
  --up:#0d7a45; --down:#b0202b;
  --rail:236px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.rail{width:var(--rail);flex:0 0 var(--rail);background:var(--ink);color:#c6ced6;padding:20px 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 20px 18px;border-bottom:1px solid #26313d;margin-bottom:14px}
.brand h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;color:#fff}
.brand p{margin:3px 0 0;font-size:11.5px;color:#7b8792;font-family:var(--mono)}
.railgroup{padding:12px 20px 6px;font-size:11px;color:#68737e;font-weight:600}
.railbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:none;border:0;text-align:left;padding:8px 20px;cursor:pointer;color:#c6ced6;font-size:13.5px;border-left:3px solid transparent}
.railbtn:hover{background:#1b2531;color:#fff}
.railbtn.on{background:#1b2531;color:#fff;border-left-color:var(--accent);font-weight:600}
.railbtn .cnt{font-family:var(--mono);font-size:11px;color:#68737e}
.railbtn.on .cnt{color:var(--accent)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---------- bankroll strip ---------- */
.strip{background:var(--panel);border-bottom:1px solid var(--rule-hard);padding:14px 26px;display:flex;gap:34px;flex-wrap:wrap;align-items:flex-end;position:sticky;top:0;z-index:20}
.stat .k{font-size:11.5px;color:var(--ink-3);margin-bottom:1px}
.stat .v{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.stat .v.sm{font-size:16px;font-weight:500}
.up{color:var(--up)} .down{color:var(--down)}
.strip .spacer{flex:1}

/* ---------- content ---------- */
.view{padding:24px 26px 60px;display:none}
.view.on{display:block}
h2.sec{margin:0 0 3px;font-size:19px;font-weight:600;letter-spacing:-.015em}
p.sub{margin:0 0 20px;color:var(--ink-2);max-width:70ch}
h3.sub2{margin:28px 0 10px;font-size:14px;font-weight:600}

.panel{background:var(--panel);border:1px solid var(--rule);margin-bottom:18px}
.panel > .ph{padding:11px 16px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel > .ph h4{margin:0;font-size:13.5px;font-weight:600}
.panel > .ph .note{font-size:12px;color:var(--ink-3)}
.pb{padding:16px}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--ink-2);padding:8px 10px;border-bottom:1px solid var(--rule-hard);white-space:nowrap;background:var(--panel);position:sticky;top:0}
td{padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f6f8f9}
.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.tscroll{max-height:560px;overflow:auto}
.thin td,.thin th{padding:5px 9px;font-size:13px}

/* ---------- controls ---------- */
.btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:6px 13px;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{background:#25303c}
.btn.ghost{background:none;color:var(--ink);border-color:var(--rule-hard)}
.btn.ghost:hover{background:#f1f4f6}
.btn.danger{background:none;color:var(--down);border-color:#e2b6ba}
.btn.danger:hover{background:#fdf1f2}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--rule-hard);background:#fff;padding:6px 9px}
textarea{width:100%;font-family:var(--mono);font-size:12px;resize:vertical}
label.fld{display:block;margin-bottom:11px}
label.fld span{display:block;font-size:12px;color:var(--ink-2);margin-bottom:3px}
label.fld input,label.fld select{width:100%}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row > *{flex:1;min-width:150px}
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{min-width:120px}

/* ---------- misc ---------- */
.tag{display:inline-block;padding:1px 7px;border:1px solid var(--rule-hard);font-size:11.5px;font-family:var(--mono);white-space:nowrap;background:#f4f6f7}
.tag.hot{background:var(--accent-soft);border-color:#e8c894;color:#8a5200}
.drop{border:1.5px dashed var(--rule-hard);background:#f6f8f9;padding:22px;text-align:center;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{display:block;font-size:13.5px;margin-bottom:3px}
.drop span{font-size:12px;color:var(--ink-2)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2)}
.empty strong{display:block;font-size:15px;color:var(--ink);margin-bottom:5px;font-weight:600}
.bar{height:7px;background:#e4e8eb;position:relative;min-width:52px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;font-size:13px;z-index:100;opacity:0;pointer-events:none;transition:opacity .16s}
.toast.on{opacity:1}
.finding{border-left:3px solid var(--accent);padding:2px 0 2px 14px;margin-bottom:16px}
.finding h5{margin:0 0 3px;font-size:13.5px;font-weight:600}
.finding p{margin:0;color:var(--ink-2);font-size:13px;max-width:74ch}
.finding .fig{font-family:var(--mono);color:var(--ink);font-weight:500}
.finding table{margin:9px 0 4px;width:auto;min-width:240px;border:1px solid var(--rule)}
.finding th,.finding td{padding:4px 11px;font-size:12.5px}
.finding th{background:#f6f8f9}
.finding td.num{font-family:var(--mono)}
.finding ol,.finding ul{margin:7px 0 0;padding-left:19px;color:var(--ink-2);font-size:13px}
.finding li{margin-bottom:4px}
.warn{background:#fdf3e3;border:1px solid #e8c894;padding:10px 13px;font-size:12.5px;margin-bottom:14px}
@media(max-width:860px){
  .shell{flex-direction:column}
  .rail{width:100%;height:auto;position:static;flex:none;padding-bottom:10px;display:flex;flex-wrap:wrap;align-items:center}
  .brand{width:100%;border-bottom:0;padding-bottom:10px;margin-bottom:4px}
  .railgroup{display:none}
  .railbtn{width:auto;border-left:0;border-bottom:3px solid transparent;padding:7px 13px}
  .railbtn.on{border-left:0;border-bottom-color:var(--accent)}
  .strip{gap:20px;padding:12px 16px}
  .view{padding:18px 14px 50px}
}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail">
    <div class="brand"><h1>DFS Ledger</h1><p id="brandSub">no entries yet</p>
      <p style="margin:4px 0 0;font-size:10.5px;color:#4d5761;font-family:var(--mono)">build 18</p></div>
    <div class="railgroup">Track</div>
    <button class="railbtn on" data-view="dash">Overview <span class="cnt" id="cDash"></span></button>
    <button class="railbtn" data-view="entries">Entries <span class="cnt" id="cEntries"></span></button>
    <button class="railbtn" data-view="exposure">Exposure</button>
    <div class="railgroup">Analyse</div>
    <button class="railbtn" data-view="structure">Structure ROI</button>
    <button class="railbtn" data-view="strategy">Strategy notes</button>
    <div class="railgroup">Data</div>
    <button class="railbtn" data-view="import">Import</button>
    <button class="railbtn" data-view="backup">Backup</button>
  </nav>
  <div class="main">
    <div class="strip" id="strip"></div>
    <div id="views"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ============================================================
   DFS LEDGER — multi-sport DFS entry + results tracker
   Core is sport-agnostic. Everything sport-specific lives in
   FORMATS below: add a format, get tracking + ROI for free.
   ============================================================ */

/* ---------- storage adapter: works on GitHub Pages, local file,
              or inside a Claude artifact ---------- */
const KEY = "dfs_ledger_v1";
const Store = {
  async load(){
    try{
      if (window.storage && window.storage.get){
        try{ const r = await window.storage.get(KEY); return r ? JSON.parse(r.value) : null; }
        catch(e){ return null; }
      }
      const raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ console.error("load failed",e); return null; }
  },
  async save(data){
    const s = JSON.stringify(data);
    try{
      if (window.storage && window.storage.set){ await window.storage.set(KEY, s); return true; }
      localStorage.setItem(KEY, s); return true;
    }catch(e){ console.error("save failed",e); toast("Couldn't save — storage may be full or blocked"); return false; }
  }
};

/* ---------- format registry ----------
   slots     : roster template
   detect    : (rosterPositionSet, sportHint) -> bool
   tags      : (lineup) -> {label: value}   derived structure worth measuring
   tagOrder  : which tags to chart on the Structure view
------------------------------------------------------------ */
const cnt = (arr, f) => arr.reduce((a,x)=>(a[f(x)]=(a[f(x)]||0)+1,a),{});
const teamSplit = lu => {
  const t = cnt(lu, p=>p.team||"?"); const v = Object.values(t).sort((a,b)=>b-a);
  return v.length<2 ? `${v[0]||0}-0` : `${v[0]}-${v[1]}`;
};
const gamesUsed = lu => new Set(lu.map(p=>p.game||p.team)).size;

function nflClassicTags(lu){
  if(!teamsResolved(lu)) return {};
  const qb = lu.find(p=>p.pos==="QB");
  let shape = "No QB", bringBack = "—";
  if (qb){
    const mates = lu.filter(p=>p!==qb && p.team===qb.team && ["WR","TE","RB"].includes(p.pos));
    const rec = mates.filter(p=>p.pos!=="RB");
    if (rec.length===0) shape = "Naked QB";
    else if (rec.length===1) shape = `QB + 1 ${rec[0].pos}`;
    else shape = `QB + ${rec.length} pass catchers`;
    if (qb.oppTeam){
      const bb = lu.filter(p=>p.team===qb.oppTeam && ["WR","TE","RB"].includes(p.pos));
      bringBack = bb.length ? `Yes (${bb.length})` : "No";
    }
    if (mates.some(p=>p.pos==="RB")) shape += " + RB";
  }
  return { "Stack shape": shape, "Bring-back": bringBack,
           "Games used": String(gamesUsed(lu)), "Teams used": String(new Set(lu.map(p=>p.team)).size) };
}
function showdownTags(lu){
  if(!teamsResolved(lu)) return {};
  const c = lu.find(p=>p.slot==="CPT") || lu[0];
  const qbs = lu.filter(p=>p.pos==="QB").length;
  return { "Captain position": c ? c.pos : "?", "Captain team": c ? (c.team||"?") : "?",
           "Team split": teamSplit(lu), "Both QBs": qbs>=2 ? "Yes" : "No" };
}
/* A lineup whose players never resolved against a salary file has no
   teams on it. Saying nothing is right; inventing a 10-0 split is not. */
const teamsResolved = lu => lu.length && lu.every(p => p.team);

function mlbTags(lu){
  if(!teamsResolved(lu)) return {};
  const isPitcher = p => ["P","SP","RP"].includes(String(p.pos||"").toUpperCase())
                      || /^P\d?$/.test(String(p.slot||"").toUpperCase());
  const bats = lu.filter(p=>!isPitcher(p));
  if(!bats.length) return {};
  /* Full partition, biggest first: 5-3, 4-4, 4-2-2, 3-3-2. Stack sizes
     and team count are all readable off this one string, so it is the
     only shape tag worth storing. */
  const byTeam = cnt(bats, p=>p.team);
  const ranked = Object.entries(byTeam).sort((a,b)=>b[1]-a[1]);
  const out = { "Stack pattern": ranked.map(r=>r[1]).join("-") };

  /* Orthogonal to the pattern: is the second stack the primary's
     opponent? Chris has bring-backs in only 21-29% of winners, so it
     is worth measuring rather than assuming. Needs opponent data. */
  if(ranked.length > 1 && bats.every(p=>p.oppTeam)){
    const primary = ranked[0][0];
    const opp = (bats.find(p=>p.team===primary)||{}).oppTeam;
    out["Bring-back"] = ranked.slice(1).some(r=>r[0]===opp) ? "Yes" : "No";
  }
  return out;
}
function nbaTags(lu){
  if(!teamsResolved(lu)) return {};
  return { "Teams used": String(new Set(lu.map(p=>p.team)).size),
           "Games used": String(gamesUsed(lu)) };
}

const FORMATS = {
  "nfl-showdown": { sport:"NFL", label:"NFL Showdown", slots:["CPT","FLEX","FLEX","FLEX","FLEX","FLEX"],
    tags: showdownTags, tagOrder:["Captain position","Team split","Both QBs","Captain team"] },
  "nfl-classic": { sport:"NFL", label:"NFL Classic", slots:["QB","RB","RB","WR","WR","WR","TE","FLEX","DST"],
    tags: nflClassicTags, tagOrder:["Stack shape","Bring-back","Games used"] },
  "mlb-showdown": { sport:"MLB", label:"MLB Showdown", slots:["CPT","UTIL","UTIL","UTIL","UTIL","UTIL"],
    tags: showdownTags, tagOrder:["Captain position","Team split","Captain team"] },
  "mlb-classic": { sport:"MLB", label:"MLB Classic", slots:["P","P","C","1B","2B","3B","SS","OF","OF","OF"],
    tags: mlbTags, tagOrder:["Stack pattern","Bring-back"] },
  "nba-showdown": { sport:"NBA", label:"NBA Showdown", slots:["CPT","UTIL","UTIL","UTIL","UTIL","UTIL"],
    tags: showdownTags, tagOrder:["Captain position","Team split","Captain team"] },
  "nba-classic": { sport:"NBA", label:"NBA Classic", slots:["PG","SG","SF","PF","C","G","F","UTIL"],
    tags: nbaTags, tagOrder:["Teams used","Games used"] }
};

/* Detect format from the slot header + the positions present. */
function detectFormat(slotHeaders, positions){
  const slots = slotHeaders.map(s=>s.toUpperCase().trim());
  const pos = new Set(positions.map(p=>(p||"").toUpperCase()));
  const isShowdown = slots.includes("CPT") || slots.includes("MVP") || slots.length===6;
  const nfl = pos.has("QB")||pos.has("DST")||pos.has("TE");
  const mlb = pos.has("SP")||pos.has("P")||pos.has("1B")||pos.has("SS")||pos.has("OF")||pos.has("C");
  const nba = pos.has("PG")||pos.has("SG")||pos.has("SF")||pos.has("PF");
  let sport = nfl ? "NFL" : nba ? "NBA" : mlb ? "MLB" : "NFL";
  if (isShowdown) return `${sport.toLowerCase()}-showdown`;
  if (slots.includes("QB")) return "nfl-classic";
  if (slots.includes("PG")) return "nba-classic";
  if (slots.includes("1B")||slots.includes("SS")) return "mlb-classic";
  return `${sport.toLowerCase()}-classic`;
}

/* ---------- state ---------- */
let DB = { entries:[], players:{}, settings:{ticketsAtFace:true, lastApproach:""},
           meta:{created:new Date().toISOString()} };
const uid = () => Math.random().toString(36).slice(2,10);
/* Local calendar date. toISOString() is UTC, which rolls over during
   US evening games and dates them a day forward. */
const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};
const money = n => (n<0?"-":"")+"$"+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => (n<0?"-":"")+"$"+Math.abs(n).toLocaleString(undefined,{maximumFractionDigits:0});
const pct = n => (n>0?"+":"")+n.toFixed(1)+"%";
/* Chris's canonical tag list, so the pickers are useful before any
   tagged data exists. Anything you've actually used gets merged in. */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const KNOWN_APPROACHES = ["Apex Cash","Apex Balanced","Apex Upside","Handy"];
/* Retired tags still on old entries stay selectable so history can be
   corrected, but they sit below the ones actually in use. */
const RETIRED_APPROACHES = () =>
  [...new Set(DB.entries.map(e=>e.approach).filter(a=>a && a!=="Untagged" && !KNOWN_APPROACHES.includes(a)))].sort();
const APPROACHES = () => [...KNOWN_APPROACHES, ...RETIRED_APPROACHES()];
const apprOptions = (sel) =>
  KNOWN_APPROACHES.map(a=>`<option value="${esc(a)}"${sel===a?" selected":""}>${esc(a)}</option>`).join("") +
  (RETIRED_APPROACHES().length
    ? `<optgroup label="No longer used">${RETIRED_APPROACHES().map(a=>`<option value="${esc(a)}"${sel===a?" selected":""}>${esc(a)}</option>`).join("")}</optgroup>`
    : "");

function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2600);
}

/* ---------- CSV ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  text = text.replace(/^\uFEFF/,"");
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    } else {
      if(c==='"') q=true;
      else if(c===","){ row.push(cur); cur=""; }
      else if(c==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(c!=="\r") cur+=c;
    }
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
const num = v => { const n=parseFloat(String(v).replace(/[$,%\s]/g,"")); return isFinite(n)?n:0; };
</script>
<script>
"use strict";
/* ============ IMPORT PIPELINES ============ */

/* DK files often carry the salary table appended to the right of the
   entries table. Find it wherever it starts. */
function extractPlayerTable(rows){
  const want = ["position","name + id","name","id","roster position","salary"];
  for (const r of rows){
    for (let c=0;c<r.length;c++){
      const win = r.slice(c,c+6).map(x=>x.toLowerCase().trim());
      if (want.every((w,i)=>win[i]===w)) return {headerRow:r, col:c};
    }
  }
  return null;
}
function ingestPlayers(rows){
  const loc = extractPlayerTable(rows);
  if(!loc) return 0;
  const c = loc.col; const start = rows.indexOf(loc.headerRow)+1; let n=0;
  const gameCol = c+6, teamCol = c+7;
  for(let i=start;i<rows.length;i++){
    const r = rows[i]; const id = (r[c+3]||"").trim();
    if(!id || !/^\d+$/.test(id)) continue;
    const game = (r[gameCol]||"").trim();
    const team = (r[teamCol]||"").trim();
    let opp = "";
    const m = game.match(/^([A-Z]{2,4})@([A-Z]{2,4})/);
    if(m) opp = (m[1]===team) ? m[2] : m[1];
    DB.players[id] = { id, name:(r[c+2]||"").trim(), pos:(r[c]||"").trim(),
      slotType:(r[c+4]||"").trim(), salary:num(r[c+5]), game, team, oppTeam:opp };
    n++;
  }
  return n;
}

/* DK prices the captain slot as its own player row, so only apply the
   multiplier when a base (FLEX) row has been dropped into a captain slot. */
function slotSalary(p, slotName){
  const capSlot = ["CPT","MVP"].includes(String(slotName).toUpperCase());
  const capRow  = ["CPT","MVP"].includes(String(p.slotType||"").toUpperCase());
  if (capSlot && !capRow) return Math.round(p.salary*1.5);
  return p.salary;
}

/* DK entries export: Entry ID, Contest Name, Contest ID, Entry Fee, then slot columns */
function ingestEntries(rows, approach){
  let hdr=null, hi=-1;
  for(let i=0;i<rows.length;i++){
    const low = rows[i].map(x=>x.toLowerCase().trim());
    if(low[0]==="entry id" && low.includes("contest name")){ hdr=rows[i]; hi=i; break; }
  }
  if(!hdr) return {added:0,skipped:0,err:"No 'Entry ID' header row found."};
  const slotCols=[]; const stop=["","instructions"];
  for(let c=4;c<hdr.length;c++){
    const h=(hdr[c]||"").trim();
    if(!h || stop.includes(h.toLowerCase())) break;
    slotCols.push({c,name:h});
  }
  if(!slotCols.length) return {added:0,skipped:0,err:"No roster slot columns found."};

  const existing = new Map(DB.entries.map(e=>[e.entryId, e]));
  let added=0, updated=0, empty=0;
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]; const eid=(r[0]||"").trim();
    if(!/^\d+$/.test(eid)) continue;
    const lineup=[];
    for(const s of slotCols){
      const raw=(r[s.c]||"").trim(); if(!raw) continue;
      const m = raw.match(/\((\d+)\)\s*$/);
      const pid = m ? m[1] : (/^\d+$/.test(raw) ? raw : null);
      const p = pid ? DB.players[pid] : null;
      lineup.push({ slot:s.name, playerId:pid||"", name:p?p.name:raw.replace(/\s*\(\d+\)\s*$/,""),
                    pos:p?p.pos:"", team:p?p.team:"", oppTeam:p?p.oppTeam:"",
                    game:p?p.game:"", salary:p?slotSalary(p,s.name):0 });
    }
    if(!lineup.length){ empty++; continue; }
    const fmt = detectFormat(slotCols.map(s=>s.name), lineup.map(p=>p.pos));
    const gi = lineup.map(p=>p.game).find(Boolean) || "";
    const dm = gi.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    const core = {
      contest:(r[1]||"").trim(), contestId:(r[2]||"").trim(), fee: num(r[3]),
      format: fmt, sport: FORMATS[fmt]?FORMATS[fmt].sport:"?",
      slate: gi.split(" ")[0] || "", lineup
    };
    /* Re-importing a file refreshes what that file knows. Results,
       payouts and approach tags live elsewhere and are left alone.
       Only overwrite the date when the file actually carries a game
       time — otherwise a re-import would stamp today onto old entries. */
    const ex = existing.get(eid);
    if(ex){
      Object.assign(ex, core);
      if(dm) ex.date = `${dm[3]}-${dm[1]}-${dm[2]}`;
      if(approach) ex.approach = approach;
      updated++; continue;
    }
    DB.entries.push(Object.assign({
      id: uid(), entryId: eid,
      /* No game time in the file means we don't know the slate date.
         Guessing "today" is wrong for anything imported after the
         game — leave it empty and let the entry-history import or a
         manual edit fill it in. */
      date: dm ? `${dm[3]}-${dm[1]}-${dm[2]}` : "",
      points:null, rank:null, fieldSize:null, payout:null,
      approach: approach || "Untagged", source:"DK entries", notes:""
    }, core));
    added++;
  }
  return {added, updated, empty};
}

/* DK "contest entry history" export from the My Contests page.
   The most complete source DraftKings gives: every entry across every
   sport, with place, points, field size, fee and winnings — everything
   except the lineups. Rows already in the ledger are updated in place,
   so results land on lineups imported earlier. */
function registerFormat(key, sport, label){
  if(!FORMATS[key]) FORMATS[key] = { sport, label, slots:[], tags:null, tagOrder:[] };
  return key;
}
function formatFromHistory(sport, gameType){
  const s = String(sport||"?").toUpperCase();
  const g = String(gameType||"").toLowerCase();
  const kind = /showdown|captain/.test(g) ? "showdown"
             : /best ball/.test(g)        ? "bestball" : "classic";
  const nice = kind==="bestball" ? "Best Ball" : kind[0].toUpperCase()+kind.slice(1);
  return registerFormat(`${s.toLowerCase()}-${kind}`, s, `${s} ${nice}`);
}
function ingestHistory(rows){
  let hdr=null, hi=-1;
  for(let i=0;i<rows.length;i++){
    const low = rows[i].map(x=>x.toLowerCase().trim());
    if(low.includes("entry_key") && low.includes("contest_date_est")){ hdr=low; hi=i; break; }
  }
  if(!hdr) return {err:"Not an entry-history file (needs Entry_Key and Contest_Date_EST columns)."};
  const C = n => hdr.indexOf(n);
  const i_key=C("entry_key"), i_ent=C("entry"), i_ck=C("contest_key"), i_dt=C("contest_date_est"),
        i_pl=C("place"), i_pt=C("points"), i_wn=C("winnings_non_ticket"), i_wt=C("winnings_ticket"),
        i_fld=C("contest_entries"), i_fee=C("entry_fee"), i_sp=C("sport"), i_gt=C("game_type");

  const byId = {}; DB.entries.forEach(e=>{ byId[e.entryId]=e; });
  let added=0, updated=0, tickets=0;
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]; const eid=String(r[i_key]||"").trim();
    if(!/^\d+$/.test(eid)) continue;
    const cash   = i_wn>=0 ? num(r[i_wn]) : 0;
    const ticket = i_wt>=0 ? num(r[i_wt]) : 0;
    if(ticket) tickets++;
    const res = {
      contest:String(r[i_ent]||"").trim(), contestId:String(r[i_ck]||"").trim(),
      date:String(r[i_dt]||"").slice(0,10), fee:num(r[i_fee]),
      points: r[i_pt]===""?null:num(r[i_pt]),
      rank:   r[i_pl]===""?null:num(r[i_pl]),
      fieldSize: i_fld>=0 ? num(r[i_fld]) : null,
      payoutCash:cash, payoutTicket:ticket,
      payout: cash + (DB.settings.ticketsAtFace ? ticket : 0)
    };
    const ex = byId[eid];
    if(ex){ Object.assign(ex, res); updated++; continue; }
    const fmt = formatFromHistory(r[i_sp], r[i_gt]);
    const gm = res.contest.match(/\(([A-Z]{2,4})\s*@\s*([A-Z]{2,4})\)/);
    const e = Object.assign({
      id:uid(), entryId:eid, format:fmt, sport:FORMATS[fmt].sport,
      slate: gm ? `${gm[1]}@${gm[2]}` : "", lineup:[],
      approach:"Untagged", source:"DK entry history", notes:""
    }, res);
    DB.entries.push(e); byId[eid]=e; added++;
  }
  return {added, updated, tickets};
}

/* Recompute payouts when the ticket-valuation setting changes. */
function applyTicketSetting(){
  DB.entries.forEach(e=>{
    if(e.payoutCash==null) return;
    e.payout = e.payoutCash + (DB.settings.ticketsAtFace ? (e.payoutTicket||0) : 0);
  });
}

/* DK contest-standings export: Rank, EntryId, EntryName, TimeRemaining, Points */
function ingestResults(rows){
  let hdr=null,hi=-1;
  for(let i=0;i<rows.length;i++){
    const low=rows[i].map(x=>x.toLowerCase().trim().replace(/\s+/g,""));
    if(low.includes("entryid") && low.includes("points")){ hdr=low; hi=i; break; }
  }
  if(!hdr) return {matched:0,err:"No standings header (needs EntryId and Points columns)."};
  const ci = n => hdr.indexOf(n);
  const iId=ci("entryid"), iPts=ci("points"), iRank=ci("rank"), iPrize=hdr.findIndex(h=>/prize|winnings|payout/.test(h));
  const byId = {}; DB.entries.forEach(e=>{ byId[e.entryId]=e; });
  let matched=0, field=0;
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]; const eid=(r[iId]||"").trim();
    if(/^\d+$/.test(eid)) field++;
    const e=byId[eid]; if(!e) continue;
    e.points = num(r[iPts]);
    if(iRank>=0 && r[iRank]) e.rank = num(r[iRank]);
    if(iPrize>=0 && r[iPrize]) e.payout = num(r[iPrize]);
    matched++;
  }
  DB.entries.forEach(e=>{ if(byId[e.entryId] && e.points!=null && !e.fieldSize && field) e.fieldSize=field; });
  return {matched, field};
}

/* Lineups snapshot player details at import time. If the salary table
   arrived later, those lineups are still holding blanks — walk them
   again against whatever is in the pool now. */
function relinkLineups(){
  let fixed=0, stillBlank=0; const missing=new Set();
  DB.entries.forEach(e=>{
    if(!e.lineup || !e.lineup.length) return;
    let changed=false, blank=false;
    e.lineup.forEach(s=>{
      const p = s.playerId ? DB.players[s.playerId] : null;
      if(p){
        if(s.team!==p.team || s.pos!==p.pos){ changed=true; }
        s.pos=p.pos; s.team=p.team; s.oppTeam=p.oppTeam; s.game=p.game;
        s.salary = slotSalary(p, s.slot);
        if(!s.name || /^\d+$/.test(s.name)) s.name = p.name;
      } else if(!s.team){
        blank=true; if(s.playerId) missing.add(s.playerId);
      }
    });
    if(changed) fixed++;
    if(blank) stillBlank++;
  });
  return {fixed, stillBlank, missing:missing.size};
}

/* ============ LEGACY MLB TRACKER CONVERSION ============
   The old MLB tracker stored one row per entry with a result but no
   lineup. Those rows still carry bankroll, contest and approach-tag
   history, so they convert cleanly — structure analysis just stays
   empty for them. */
function looksLegacyMLB(r){
  return r && typeof r === "object" && !r.lineup
      && r.contest != null && (r.cls != null || r.ctype != null);
}
function convertLegacy(r){
  const showdown = /showdown/i.test(r.contest || "");
  const gm = String(r.contest||"").match(/\(([A-Z]{2,3})\s*@\s*([A-Z]{2,3})\)/);
  const fee = num(r.fee != null ? r.fee : r.invested);
  return {
    id: uid(),
    entryId: "mlb-" + String(r.id != null ? r.id : Math.random()),
    contest: String(r.contest||"").trim(), contestId: "",
    fee, format: showdown ? "mlb-showdown" : "mlb-classic", sport: "MLB",
    slate: gm ? `${gm[1]}@${gm[2]}` : "",
    date: r.date || "", lineup: [],
    points:    r.pts   == null ? null : num(r.pts),
    rank:      r.rank  == null ? null : num(r.rank),
    fieldSize: r.field == null ? null : num(r.field),
    payout:    r.win   == null ? null : num(r.win),
    approach: String(r.tag||"").trim() || "Untagged",
    contestClass: r.cls || "", contestType: r.ctype || "",
    source: "MLB tracker", notes: ""
  };
}

/* ============ DERIVED / AGGREGATION ============ */
function tagsFor(e){
  const f = FORMATS[e.format];
  if(!f || !f.tags || !e.lineup || !e.lineup.length) return {};
  try{ return f.tags(e.lineup); }catch(err){ return {}; }
}
function settled(e){ return e.payout!=null || e.points!=null; }
function net(e){ return (e.payout||0) - (e.fee||0); }

function agg(list){
  const fees = list.reduce((a,e)=>a+(e.fee||0),0);
  const won  = list.reduce((a,e)=>a+(e.payout||0),0);
  const s = list.filter(e=>e.payout!=null);
  const sf = s.reduce((a,e)=>a+(e.fee||0),0);
  const sw = s.reduce((a,e)=>a+(e.payout||0),0);
  return { n:list.length, fees, won, net:won-fees,
           roi: sf>0 ? (sw-sf)/sf*100 : null,
           settled:s.length, cashes:s.filter(e=>(e.payout||0)>0).length,
           cashRate: s.length ? s.filter(e=>(e.payout||0)>0).length/s.length*100 : null };
}
function groupBy(list, fn){
  const g={}; list.forEach(e=>{ const k=fn(e); if(k==null) return; (g[k]=g[k]||[]).push(e); }); return g;
}
</script>
<script>
"use strict";
/* ============ FILTER STATE ============ */
const F = { sport:"", format:"", contest:"", from:"", to:"" };
function filtered(){

    (!F.sport  || e.sport===F.sport) &&

}
const uniq = fn => [...new Set(DB.entries.map(fn).filter(Boolean))].sort();

    <select data-f="format"><option value="">All formats</option>${uniq(e=>e.format).map(s=>`<option value="${esc(s)}"${F.format===s?" selected":""}>${esc(FORMATS[s]?FORMATS[s].label:s)}</option>`).join("")}</select>
    <select data-f="contest"><option value="">All contests</option>${uniq(e=>e.contest).map(s=>`<option value="${esc(s)}"${F.contest===s?" selected":""}>${esc(s.length>44?s.slice(0,44)+"…":s)}</option>`).join("")}</select>
    <input type="date" data-f="from" value="${F.from}" title="From date">

  </div>`;
}

/* ============ VIEWS ============ */
function vStrip(){
  const a = agg(filtered());
  const cls = a.net>0?"up":a.net<0?"down":"";
  const rcl = a.roi==null?"":a.roi>0?"up":a.roi<0?"down":"";
  return `
    <div class="stat"><div class="k">Net</div><div class="v ${cls}">${a.n?money0(a.net):"—"}</div></div>
    <div class="stat"><div class="k">ROI</div><div class="v ${rcl}">${a.roi==null?"—":pct(a.roi)}</div></div>
    <div class="stat"><div class="k">Entered</div><div class="v sm">${a.n?money0(a.fees):"—"}</div></div>
    <div class="stat"><div class="k">Won</div><div class="v sm">${a.n?money0(a.won):"—"}</div></div>
    <div class="stat"><div class="k">Cash rate</div><div class="v sm">${a.cashRate==null?"—":a.cashRate.toFixed(0)+"%"}</div></div>
    <div class="spacer"></div>
    <div class="stat"><div class="k">Entries</div><div class="v sm">${a.n.toLocaleString()}${
      a.n < DB.entries.length ? `<span style="color:var(--accent);font-size:12px"> of ${DB.entries.length.toLocaleString()} — filtered</span>`
                              : `<span style="color:var(--ink-3);font-size:12px"> / ${a.settled.toLocaleString()} settled</span>`
    }</div></div>`;
}

function roiTable(groups, labelHead){
  const keys = Object.keys(groups).sort((a,b)=>agg(groups[b]).n-agg(groups[a]).n);
  if(!keys.length) return `<div class="empty">Nothing to break down yet.</div>`;
  const max = Math.max(...keys.map(k=>agg(groups[k]).n));
  return `<table class="thin"><thead><tr>
      <th>${esc(labelHead)}</th><th class="num">Entries</th><th></th>
      <th class="num">Entered</th><th class="num">Won</th><th class="num">Net</th>
      <th class="num">ROI</th><th class="num">Cash%</th></tr></thead><tbody>
    ${keys.map(k=>{const a=agg(groups[k]);return `<tr>
      <td>${esc(k)}</td>
      <td class="num">${a.n}</td>
      <td style="width:70px"><div class="bar"><i style="width:${a.n/max*100}%"></i></div></td>
      <td class="num">${money0(a.fees)}</td>
      <td class="num">${money0(a.won)}</td>
      <td class="num ${a.net>0?"up":a.net<0?"down":""}">${a.settled?money0(a.net):"—"}</td>
      <td class="num ${a.roi==null?"":a.roi>0?"up":"down"}">${a.roi==null?"—":pct(a.roi)}</td>
      <td class="num">${a.cashRate==null?"—":a.cashRate.toFixed(0)+"%"}</td></tr>`;}).join("")}
  </tbody></table>`;
}

function vDash(){
  const list = filtered();
  if(!DB.entries.length) return `<h2 class="sec">Overview</h2>
    <div class="panel"><div class="empty"><strong>No entries yet</strong>
    Import a DraftKings entries file to get started. Go to Import.</div></div>`;
  const bySport = groupBy(list, e=>e.sport);
  const byFormat = groupBy(list, e=>FORMATS[e.format]?FORMATS[e.format].label:e.format);
  const byContest = groupBy(list, e=>e.contest.length>52?e.contest.slice(0,52)+"…":e.contest);
  const byApproach = groupBy(list, e=>e.approach);
  const byType = groupBy(list, e=>e.contestType);
  const slates = groupBy(list, e=>`${e.date} · ${e.slate||FORMATS[e.format].sport}`);
  const skeys = Object.keys(slates).sort().reverse().slice(0,14);
  const unsettled = list.filter(e=>e.payout==null).length;
  return `<h2 class="sec">Overview</h2>
  <p class="sub">Everything below respects the filters. ROI counts only entries with a payout recorded.</p>
  ${filterBar("fDash")}
  ${unsettled?`<div class="warn" style="margin-top:14px">${unsettled} ${unsettled===1?"entry has":"entries have"} no payout recorded yet, so they sit outside every ROI figure. Import a contest-standings file or type payouts in on the Entries view.</div>`:"<div style='height:14px'></div>"}
  <div class="panel"><div class="ph"><h4>By sport</h4></div>${roiTable(bySport,"Sport")}</div>
  <div class="panel"><div class="ph"><h4>By format</h4></div>${roiTable(byFormat,"Format")}</div>
  ${Object.keys(byApproach).length ? `<div class="panel"><div class="ph"><h4>By approach</h4>
      <span class="note">how the lineups were generated</span></div>${roiTable(byApproach,"Approach")}</div>` : ""}
  ${Object.keys(byType).length ? `<div class="panel"><div class="ph"><h4>By contest type</h4></div>${roiTable(byType,"Type")}</div>` : ""}
  <div class="panel"><div class="ph"><h4>By contest</h4></div>${roiTable(byContest,"Contest")}</div>
  <div class="panel"><div class="ph"><h4>Recent slates</h4><span class="note">most recent 14</span></div>
    ${roiTable(Object.fromEntries(skeys.map(k=>[k,slates[k]])),"Slate")}</div>`;
}

function vEntries(){
  const list = filtered().slice().sort((a,b)=>
    (a.date?1:0)-(b.date?1:0) || b.date.localeCompare(a.date) || (b.points||0)-(a.points||0));
  if(!DB.entries.length) return `<h2 class="sec">Entries</h2><div class="panel"><div class="empty">
    <strong>No entries yet</strong>Import a DraftKings entries file first.</div></div>`;
  return `<h2 class="sec">Entries</h2>
  <p class="sub">Date, approach, points, rank and payout are editable — click a cell and type. Dates use YYYY-MM-DD. Use the filters plus Apply to tag a whole block at once. Structure tags are derived from the lineup, not typed.</p>
  ${filterBar("fEnt")}
  ${(()=>{const n=list.filter(e=>!e.date).length; return n?`<div class="warn" style="margin-top:14px">${n} ${n===1?"entry has":"entries have"} no date — the file they came from carried no game time. Drop an entry-history CSV to fill them in from DraftKings, or type the date in the highlighted cells. Undated entries drop out of any date-filtered view.</div>`:"";})()}
  <div class="panel" style="margin-top:14px"><div class="ph">
      <h4>${list.length} ${list.length===1?"entry":"entries"}</h4>
      <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">
        <span class="note">Set approach for all ${list.length} in view:</span>
        <select id="bulkAppr" style="min-width:160px">
          <option value="">— choose —</option>
          ${apprOptions("")}
        </select>
        <button class="btn ghost" id="bulkApprGo">Apply</button>
      </div></div>
    <div class="tscroll"><table class="thin"><thead><tr>
      <th>Date</th><th>Contest</th><th>Format</th><th>Approach</th><th>Lineup</th><th>Structure</th>
      <th class="num">Fee</th><th class="num">Pts</th><th class="num">Rank</th>
      <th class="num">Payout</th><th class="num">Net</th><th></th></tr></thead><tbody>
    ${list.map(e=>{
      const t = tagsFor(e);
      const f = FORMATS[e.format];
      const chips = (f?f.tagOrder:[]).slice(0,3).map(k=>t[k]?`<span class="tag">${esc(t[k])}</span>`:"").join(" ");
      const lu = e.lineup.length
        ? e.lineup.map(p=>p.slot.toUpperCase()==="CPT"?`<b>${esc(p.name)}</b>`:esc(p.name)).join(", ")
        : `<span style="color:var(--ink-3)">not recorded</span>`;
      const nv = net(e);
      return `<tr data-id="${e.id}">
        <td style="white-space:nowrap${e.date?"":";background:var(--accent-soft)"}" contenteditable data-fld="date" data-type="text">${e.date?esc(e.date):""}</td>
        <td title="${esc(e.contest)}">${esc(e.contest.length>26?e.contest.slice(0,26)+"…":e.contest)}</td>

      </tr>`;}).join("")}
    </tbody></table></div></div>`;
}

function vStructure(){
  const list = filtered();
  if(!list.length) return `<h2 class="sec">Structure ROI</h2><div class="panel"><div class="empty">
    <strong>Nothing to analyse yet</strong>Import entries, then record results.</div></div>`;
  const readable = list.filter(e=>e.lineup.length && Object.keys(tagsFor(e)).length);
  const withLineups = readable;
  const fmts = [...new Set(readable.map(e=>e.format))];
  const bare = list.filter(e=>!e.lineup.length).length;
  const unresolved = list.filter(e=>e.lineup.length && !Object.keys(tagsFor(e)).length).length;
  let html = `<h2 class="sec">Structure ROI</h2>
  <p class="sub">How each build shape actually performed. Structure is read off the lineup automatically, so this fills in as you import — nothing to tag by hand.</p>
  ${filterBar("fStruct")}
  ${(()=>{
    if(!unresolved) return "";
    const bad = list.filter(e=>e.lineup.length && !Object.keys(tagsFor(e)).length);
    const byFmt = groupBy(bad, e=>FORMATS[e.format]?FORMATS[e.format].label:e.format);
    const ids = new Set(); let slots=0, blanks=0;
    bad.forEach(e=>e.lineup.forEach(s=>{ slots++; if(!s.team){ blanks++; if(s.playerId) ids.add(s.playerId); } }));
    return `<div class="warn" style="margin-top:14px">
      <b>${unresolved} ${unresolved===1?"lineup":"lineups"} excluded</b> — structure needs every player linked to a team, and ${blanks} of ${slots} roster slots in these are unlinked (${ids.size} distinct player IDs not in the pool).
      <div style="margin-top:6px">${Object.entries(byFmt).sort((a,b)=>b[1].length-a[1].length).map(([k,v])=>`${esc(k)}: ${v.length}`).join(" · ")}</div>
      <div style="margin-top:6px">Load the DKSalaries file for those slates, then use <b>Re-link lineups</b> on the Import tab.</div></div>`;
  })()}
  ${bare?`<div class="warn" style="margin-top:14px">${bare} ${bare===1?"entry has":"entries have"} no lineup recorded — imported history, most likely. They count toward bankroll and approach ROI but cannot be broken down by build shape.</div>`:""}
  <div class="warn" style="margin-top:14px">One season of NFL gives roughly twenty slates. These splits will not reach significance inside a year — read them as a process audit, not proof that a shape is profitable.</div>`;
  const appr = groupBy(list, e=>e.approach);
  if(Object.keys(appr).length > 1)
    html += `<h3 class="sub2">Approach <span style="color:var(--ink-3);font-weight:400">· across every format</span></h3>
      <div class="panel"><div class="ph"><h4>How the lineups were generated</h4></div>${roiTable(appr,"Approach")}</div>`;
  for(const fk of fmts){
    const f = FORMATS[fk]; if(!f) continue;
    const sub = withLineups.filter(e=>e.format===fk);
    html += `<h3 class="sub2">${esc(f.label)} <span style="color:var(--ink-3);font-weight:400">· ${sub.length} entries</span></h3>`;
    for(const tag of f.tagOrder){
      const g = groupBy(sub, e=>tagsFor(e)[tag]);
      if(!Object.keys(g).length) continue;
      html += `<div class="panel"><div class="ph"><h4>${esc(tag)}</h4></div>${roiTable(g,tag)}</div>`;
    }
  }
  return html;
}

function vExposure(){
  const list = filtered().filter(e=>e.lineup.length);
  if(!list.length) return `<h2 class="sec">Exposure</h2><div class="panel"><div class="empty">
    <strong>No lineups in view</strong>Exposure needs recorded lineups. Imported history without them won't appear here.</div></div>`;
  const slates = groupBy(list, e=>`${e.date} · ${e.slate||e.sport} · ${e.contest.length>34?e.contest.slice(0,34)+"…":e.contest}`);
  const keys = Object.keys(slates).sort().reverse();
  return `<h2 class="sec">Exposure</h2>
  <p class="sub">Player exposure per contest, with captain share broken out where the format has one.</p>
  ${filterBar("fExp")}
  <div style="height:14px"></div>
  ${keys.map(k=>{
    const es = slates[k]; const n = es.length;
    const tot={}, cap={}, pts={};
    es.forEach(e=>e.lineup.forEach(p=>{
      if(!p.name) return;
      tot[p.name]=(tot[p.name]||0)+1;
      if(p.slot.toUpperCase()==="CPT") cap[p.name]=(cap[p.name]||0)+1;
      pts[p.name]=p.team||"";
    }));
    const names=Object.keys(tot).sort((a,b)=>tot[b]-tot[a]);
    return `<div class="panel"><div class="ph"><h4>${esc(k)}</h4><span class="note">${n} ${n===1?"lineup":"lineups"}</span></div>
      <div class="tscroll" style="max-height:340px"><table class="thin"><thead><tr>
        <th>Player</th><th>Team</th><th class="num">Lineups</th><th></th><th class="num">Exposure</th><th class="num">As captain</th>
      </tr></thead><tbody>${names.map(nm=>`<tr>
        <td>${esc(nm)}</td><td>${esc(pts[nm])}</td>
        <td class="num">${tot[nm]}</td>
        <td style="width:90px"><div class="bar"><i style="width:${tot[nm]/n*100}%"></i></div></td>
        <td class="num">${(tot[nm]/n*100).toFixed(0)}%</td>
        <td class="num">${cap[nm]?(cap[nm]/n*100).toFixed(0)+"%":"—"}</td></tr>`).join("")}
      </tbody></table></div></div>`;
  }).join("")}`;
}

<script>

<script>
"use strict";
/* ============ WIRING ============ */
const VIEWS = { dash:vDash, entries:vEntries, exposure:vExposure, structure:vStructure,
                strategy:vStrategy, import:vImport, backup:vBackup };
let CUR = "dash";

function render(){
  document.getElementById("strip").innerHTML = vStrip();
  document.getElementById("views").innerHTML = `<div class="view on">${VIEWS[CUR]()}</div>`;
  document.getElementById("cEntries").textContent = DB.entries.length || "";
  const set = DB.entries.filter(e=>e.payout!=null).length;
  document.getElementById("cDash").textContent = set ? `${set}` : "";
  const a = agg(DB.entries);
  document.getElementById("brandSub").textContent =
    DB.entries.length ? `${DB.entries.length} entries · ${a.roi==null?"unsettled":pct(a.roi)+" ROI"}` : "no entries yet";
  document.querySelectorAll(".railbtn").forEach(b=>b.classList.toggle("on", b.dataset.view===CUR));
  wire();
}
async function persist(){ await Store.save(DB); }

function wire(){
  document.querySelectorAll("[data-f]").forEach(el=>{
    el.onchange = () => { F[el.dataset.f] = el.value; render(); };
  });
  const cl = document.querySelector("[data-clear]");
  if(cl) cl.onclick = () => { Object.keys(F).forEach(k=>F[k]=""); render(); };

  document.querySelectorAll("[contenteditable][data-fld]").forEach(td=>{
    td.onblur = async () => {
      const id = td.closest("tr").dataset.id, fld = td.dataset.fld;
      const e = DB.entries.find(x=>x.id===id); if(!e) return;
      const raw = td.textContent.trim();
      if(td.dataset.type === "text"){
        if(fld === "date" && raw && !/^\d{4}-\d{2}-\d{2}$/.test(raw)){
          toast("Dates need to look like 2026-09-10"); render(); return;
        }
        e[fld] = raw;
      } else {
        e[fld] = raw==="" ? null : num(raw);
      }
      await persist(); render();
    };
    td.onkeydown = ev => { if(ev.key==="Enter"){ ev.preventDefault(); td.blur(); } };
  });
  document.querySelectorAll("[data-del]").forEach(b=>{
    b.onclick = async () => {
      const e = DB.entries.find(x=>x.id===b.dataset.del);
      if(!e || !confirm(`Remove entry ${e.entryId}? This cannot be undone.`)) return;
      DB.entries = DB.entries.filter(x=>x.id!==b.dataset.del);
      await persist(); render(); toast("Entry removed");
    };
  });

  /* file drops */
  const pick = document.getElementById("filePick");
  document.querySelectorAll(".drop").forEach(d=>{
    d.onclick = () => { pick.dataset.kind = d.dataset.kind; pick.value=""; pick.click(); };
    d.ondragover = ev => { ev.preventDefault(); d.classList.add("over"); };
    d.ondragleave = () => d.classList.remove("over");
    d.ondrop = ev => { ev.preventDefault(); d.classList.remove("over");
      if(ev.dataTransfer.files[0]) handleFile(ev.dataTransfer.files[0], d.dataset.kind); };
  });
  if(pick) pick.onchange = () => { if(pick.files[0]) handleFile(pick.files[0], pick.dataset.kind); };

  const rl = document.getElementById("relink");
  if(rl) rl.onclick = async () => {
    const r = relinkLineups();
    await persist(); render();
    const parts = [`${r.fixed} lineups re-linked`];
    if(r.stillBlank) parts.push(`${r.stillBlank} still incomplete (${r.missing} player IDs not in the pool)`);
    toast(parts.join(" · "));
  };

  const bulkBtn = document.getElementById("bulkApprGo");
  if(bulkBtn) bulkBtn.onclick = async () => {
    const v = document.getElementById("bulkAppr").value.trim();
    if(!v){ toast("Choose an approach first"); return; }
    const rows = filtered();
    if(!confirm(`Set the approach to "${v}" on ${rows.length} ${rows.length===1?"entry":"entries"}? This overwrites any tag already on them.`)) return;
    rows.forEach(e=>{ e.approach = v; });
    await persist(); render(); toast(`${rows.length} tagged as ${v}`);
  };

  const b = id => document.getElementById(id);
  const ap = b("apprTag");
  if(ap) ap.onchange = () => { DB.settings.lastApproach = ap.value; persist(); };
  const tix = b("tixFace");
  if(tix){
    tix.checked = !!DB.settings.ticketsAtFace;
    tix.onchange = async () => {
      DB.settings.ticketsAtFace = tix.checked;
      applyTicketSetting(); await persist(); render();
      toast(tix.checked ? "Tickets counted at face value" : "Tickets counted as zero");
    };
  }
  if(b("expJson")) b("expJson").onclick = () => download(`dfs-ledger-${today()}.json`, JSON.stringify(DB,null,2), "application/json");
  if(b("expCsv"))  b("expCsv").onclick = exportCsv;
  if(b("impBtn"))  b("impBtn").onclick = mergeJson;
  if(b("wipe"))    b("wipe").onclick = async () => {
    if(!confirm("Delete every entry and player from this browser? Export a backup first — this cannot be undone.")) return;
    DB = { entries:[], players:{}, settings:{ticketsAtFace:true}, meta:{created:new Date().toISOString()} };
    await persist(); render(); toast("Ledger cleared");
  };
}

function handleFile(file, kind){
  const fr = new FileReader();
  fr.onload = async () => {
    let rows;
    try{ rows = parseCSV(fr.result); }
    catch(e){ toast("Couldn't read that file as CSV"); return; }
    if(kind==="history"){
      const sel = document.getElementById("apprTag");
      const wanted = sel ? sel.value.trim() : "";
      const h = ingestHistory(rows);
      if(h.err){ toast(h.err); return; }
      await persist(); render();
      const bits=[];
      if(h.added) bits.push(`${h.added} added`);
      if(h.updated) bits.push(`${h.updated} updated`);
      if(h.tickets) bits.push(`${h.tickets} ticket prizes`);
      toast(bits.length ? bits.join(" · ") : "Nothing to import");
      /* The approach picker belongs to the lineups drop zone. Saying so
         beats letting someone believe a whole import got tagged. */
      if(wanted && h.added)
        setTimeout(()=>toast(`Not tagged — "${wanted}" only applies to the lineups file. Tag these in bulk from the Entries view.`), 2900);
    } else if(kind==="salaries"){
      const n = ingestPlayers(rows);
      if(!n){ toast("No salary table found in that file"); return; }
      const rl = relinkLineups();
      await persist(); render();
      toast(`${n} players loaded${rl.fixed?` · ${rl.fixed} lineups re-linked`:""}`);
    } else if(kind==="results"){
      const r = ingestResults(rows);
      if(r.err){ toast(r.err); return; }
      await persist(); render();
      toast(r.matched ? `${r.matched} entries updated` : "No Entry IDs in that file matched your entries");
    } else {
      const ap = document.getElementById("apprTag");
      const approach = ap ? ap.value.trim() : "";
      if(approach){ DB.settings.lastApproach = approach; }
      const p = ingestPlayers(rows);
      const r = ingestEntries(rows, approach);
      if(r.err){ toast(r.err); return; }
      await persist(); render();
      const bits = [`${r.added} added`];
      if(r.updated) bits.push(`${r.updated} refreshed`);
      if(approach)  bits.push(`tagged ${approach}`);
      if(r.empty)   bits.push(`${r.empty} unfilled`);
      if(p)         bits.push(`${p} players`);
      toast(bits.join(" · "));
      if(r.added && !p && !Object.keys(DB.players).length)
        setTimeout(()=>toast("No salary table in that file — drop a DKSalaries CSV to fill in teams and positions"),2800);
    }
  };
  fr.readAsText(file);
}

function download(name, text, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text],{type}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
  toast("Downloaded");
}
function exportCsv(){
  const head = ["Date","Sport","Format","Contest","EntryID","Fee","Points","Rank","Payout","Net"];
  const tagKeys = [...new Set(DB.entries.flatMap(e=>Object.keys(tagsFor(e))))];
  const maxSlots = Math.max(0,...DB.entries.map(e=>e.lineup.length));
  const slotHead = Array.from({length:maxSlots},(_,i)=>`Slot ${i+1}`);
  const q = v => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const lines = [[...head,...tagKeys,...slotHead].map(q).join(",")];
  DB.entries.forEach(e=>{
    const t = tagsFor(e);
    lines.push([e.date,e.sport,FORMATS[e.format]?FORMATS[e.format].label:e.format,e.contest,e.entryId,
      e.fee,e.points,e.rank,e.payout, e.payout==null?"":net(e),
      ...tagKeys.map(k=>t[k]||""),
      ...Array.from({length:maxSlots},(_,i)=>{const p=e.lineup[i];return p?`${p.slot}: ${p.name}`:"";})
    ].map(q).join(","));
  });
  download(`dfs-ledger-${today()}.csv`, lines.join("\n"), "text/csv");
}
async function mergeJson(){
  const ta = document.getElementById("impJson");
  let inc;
  try{ inc = JSON.parse(ta.value); }
  catch(e){ toast("That is not valid JSON"); return; }

  /* Accept three shapes: a DFS Ledger backup, a bare array of entries,
     or a whole-origin localStorage dump with the old tracker's key inside. */
  let rows = [];
  if (Array.isArray(inc)) rows = inc;
  else if (inc && Array.isArray(inc.entries)) rows = inc.entries;
  else if (inc && typeof inc === "object"){
    for (const v of Object.values(inc)){
      if (Array.isArray(v)) { rows = rows.concat(v); continue; }
      if (typeof v === "string"){
        try { const p = JSON.parse(v); if (Array.isArray(p)) rows = rows.concat(p); } catch(err){}
      }
    }
  }

  const have = new Set(DB.entries.map(e=>e.entryId));
  let added=0, legacy=0, tagged=0;
  rows.forEach(raw=>{
    if(!raw || typeof raw !== "object") return;
    let e = raw;
    if(looksLegacyMLB(raw)){
      /* If this contest is already in the ledger from the DK entry
         history, don't add it twice — just carry the approach tag over. */
      const hit = DB.entries.find(x =>
        !x._tagged && x.approach === "Untagged" &&
        x.date === raw.date &&
        x.contest === String(raw.contest||"").trim() &&
        Math.abs((x.points||0) - num(raw.pts)) < 0.011 &&
        Math.abs((x.fee||0) - num(raw.fee != null ? raw.fee : raw.invested)) < 0.011);
      if(hit){
        hit.approach = String(raw.tag||"").trim() || "Untagged";
        hit._tagged = true; tagged++; return;
      }
      e = convertLegacy(raw); legacy++;
    }
    if(!e || !e.entryId || have.has(e.entryId)) return;
    if(!e.id) e.id = uid();
    if(!e.lineup) e.lineup = [];
    if(!e.format) e.format = detectFormat(e.lineup.map(p=>p.slot||""), e.lineup.map(p=>p.pos||""));
    if(!e.sport)  e.sport  = FORMATS[e.format] ? FORMATS[e.format].sport : "?";
    if(!e.approach) e.approach = "Untagged";
    DB.entries.push(e); have.add(e.entryId); added++;
  });
  DB.entries.forEach(x=>{ delete x._tagged; });
  if(inc && inc.players) Object.assign(DB.players, inc.players);
  await persist(); ta.value=""; render();
  const bits=[];
  if(added)  bits.push(`${added} merged`);
  if(tagged) bits.push(`${tagged} tagged onto existing entries`);
  if(legacy) bits.push(`${legacy} converted`);
  toast(bits.length ? bits.join(" · ") : "Nothing new to merge");
}

document.querySelectorAll(".railbtn").forEach(b=>{
  b.onclick = () => { CUR = b.dataset.view; render(); window.scrollTo(0,0); };
});

(async function init(){
  const saved = await Store.load();
  if(saved && saved.entries) DB = Object.assign(DB, saved);
  if(!DB.settings) DB.settings = { ticketsAtFace:true };
  /* re-register any formats that only exist because of an import */
  DB.entries.forEach(e=>{ if(!FORMATS[e.format]) registerFormat(e.format, e.sport||"?", e.format); });
  render();
})();
</script>
